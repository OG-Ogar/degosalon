name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Verify generated JavaScript is current
        run: git diff --exit-code -- static/app.js

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Resolve Go module checksums
        run: go mod download

      - name: Build deployment binaries
        run: |
          go build -tags netgo -ldflags '-s -w' -o /tmp/degosalon-app
          go build -tags netgo -ldflags '-s -w' -o /tmp/degosalon-migrate ./cmd/migrate
          go build -tags netgo -ldflags '-s -w' -o /tmp/degosalon-media ./cmd/media
          go build -tags netgo -ldflags '-s -w' -o /tmp/degosalon-audit ./cmd/audit

      - name: Validate Render Blueprint
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.23.0
          python - <<'PY'
          import json, urllib.request, yaml, jsonschema
          with urllib.request.urlopen('https://render.com/schema/render.yaml.json', timeout=30) as response:
              schema = json.load(response)
          with open('render.yaml') as source:
              jsonschema.validate(yaml.safe_load(source), schema)
          print('Render Blueprint validates against the official JSON schema')
          PY

      - name: Test Go application
        run: go test ./...

      - name: Vet Go application
        run: go vet ./...

      - name: Race-check Go application
        run: go test -race ./...

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Verify PostgreSQL integrity and request flows
        run: go test -race -v ./storage ./handlers ./session ./reset ./internal/dbmigrate -run TestPostgres -count=1 -timeout=5m

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
