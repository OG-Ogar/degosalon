services:
  - type: web
    name: baba-multiverse
    runtime: go
    branch: main
    buildCommand: npm ci && npm run build && go build -tags netgo -ldflags '-s -w' -o app && go build -tags netgo -ldflags '-s -w' -o migrate ./cmd/migrate && go build -tags netgo -ldflags '-s -w' -o media ./cmd/media && go build -tags netgo -ldflags '-s -w' -o audit ./cmd/audit
    startCommand: ./migrate && ./media -create-bucket && ./app
    healthCheckPath: /health/ready
    envVars:
      - key: GO_VERSION
        value: "1.23.0"
      - key: APP_ENV
        value: "production"
      - key: SECURE_COOKIES
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SHOW_RESET_LINKS
        value: "0"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_TLS_MODE
        value: "starttls"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: RESET_MAIL_KEY
        generateValue: true

      - key: BOOKING_TIMEZONE
        value: "Africa/Lagos"
