services:
  - type: web
    name: baba-multiverse
    runtime: go
    branch: main
    buildCommand: npm ci && npm run build && go build -tags netgo -ldflags '-s -w' -o app && go build -tags netgo -ldflags '-s -w' -o migrate ./cmd/migrate
    startCommand: ./migrate && ./app
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SHOW_RESET_LINKS
        value: "0"

      - key: BOOKING_TIMEZONE
        value: "Africa/Lagos"
