services:
  - type: web
    name: baba-multiverse
    runtime: go
    branch: main
    buildCommand: npm install --no-audit --no-fund && npm run build && go mod tidy && go build -tags netgo -ldflags '-s -w' -o app
    startCommand: ./app
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SHOW_RESET_LINKS
        value: "0"

      - key: BOOKING_TIMEZONE
        value: "Africa/Lagos"
