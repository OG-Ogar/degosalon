<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Barber</title>
</head>
<body>

<h1>Add Barber</h1>

<p>
    <a href="/admin/barbers">
        ← Back to Barbers
    </a>
</p>

<hr>

<form method="POST" action="/admin/barbers/new">

<p>

<label>Full Name</label><br>

<input
type="text"
name="fullname"
required>

</p>

<p>

<label>Phone Number</label><br>

<input
type="text"
name="phone"
required>

</p>

<p>

<label>Email</label><br>

<input
type="email"
name="email"
required>

</p>

<p>

<label>Shop Name</label><br>

<input
type="text"
name="shopname"
required>

</p>

<p>

<label>Shop Address</label><br>

<input
type="text"
name="shopaddress"
required>

</p>

<p>

<button type="submit">
Create Barber
</button>

</p>

</form>

</body>
</html>
