<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Delete Barber</title>
</head>
<body>

<h1>Delete Barber</h1>

<p>

<a href="/">Home</a>

|

<a href="/admin/dashboard">Dashboard</a>

|

<a href="/admin/barbers">

Barber List

</a>

</p>

<hr>

<p>

Are you sure you want to delete

<strong>{{.FullName}}</strong>?

</p>

<p>

<strong>Warning:</strong>

This action permanently removes the barber from the system.

</p>

<form method="POST" action="/admin/barbers/{{.ID}}/delete">

<button type="submit">

Yes, Delete Barber

</button>

</form>

<br>

<p>

<a href="/admin/barbers/{{.ID}}">

Cancel

</a>

</p>

</body>
</html>
