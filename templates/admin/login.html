<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Admin Login - De Go Salon</title>

<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/login.css">
<link rel="stylesheet" href="/static/ui.css">
<link rel="stylesheet" href="/static/theme.css">
<script src="/static/theme-switch.js"></script>

<script src="/static/app.js" defer></script>


</head>

<body class="auth-page admin-auth modern-role-page">

<main class="auth-layout">


<section class="auth-card">

    <div class="auth-brand">
        <a href="/">De Go Salon</a>
    </div>

    <div class="auth-header">
        <h1>Admin Login</h1>
        <p>Welcome back. Sign in to continue.</p>
    </div>

    {{template "form-error" .Error}}

    <form class="auth-form ui-form"
          method="post"
          action="/admin/login" {{if .Error}}aria-describedby="form-error"{{end}}>

        <div class="auth-field ui-field">
            <label for="username">Username</label>

            <input
                id="username"
                type="text"
                name="username"
                value="{{index .Values "username"}}"
                autocomplete="username"
                placeholder="Enter your username"
                required
            >
        </div>

        <div class="auth-field ui-field">
            <label for="password">Password</label>

            <input
                id="password"
                type="password"
                name="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                required
            >
        </div>

        <button class="auth-submit ui-control" type="submit">
            Sign In
        </button>

    </form>

    <div class="auth-footer">
        <a href="/">
            ← Back to De Go Salon
        </a>
    </div>

</section>


</main>

{{template "public-footer" .}}
</body>
</html>
