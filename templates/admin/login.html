<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
</head>
<body>

<h1>Admin Login</h1>

<p>

<a href="/">

← Back Home

</a>

</p>

<hr>

<form method="POST" action="/admin/login">

<p>

<label for="username">

Username

</label>

<br>

<input
type="text"
id="username"
name="username"
required>

</p>

<p>

<label for="password">

Password

</label>

<br>

<input
type="password"
id="password"
name="password"
required>

</p>

<p>

<button type="submit">

Login

</button>

</p>

</form>

</body>
</html>
