<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Chat</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            margin:40px;
        }

        .chat-box{
            width:700px;
            height:400px;
            border:1px solid #ccc;
            overflow-y:auto;
            padding:15px;
            margin-bottom:20px;
        }

        .message{
            margin-bottom:15px;
        }

        textarea{
            width:700px;
            height:80px;
        }

    </style>

</head>
<body>

<h1>Customer Chat</h1>

<p>

<a href="/barber/dashboard">

← Back to Dashboard

</a>

</p>

<hr>

<div class="chat-box">

{{if .Messages}}

{{range .Messages}}

<div class="message">

<strong>{{.Sender}}</strong>

<br>

{{.Text}}

</div>

{{end}}

{{else}}

<p>No messages yet.</p>

{{end}}

</div>

<form method="POST">

<textarea
name="message"
placeholder="Type your message..."
required>
</textarea>

<br><br>

<button type="submit">

Send Message

</button>

</form>

</body>
</html>
