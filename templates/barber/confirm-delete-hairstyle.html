<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - De Go Salon</title>
    <link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/ui.css">
    <script src="/static/app.js" defer></script>
</head>
<body class="modern-role-page">

{{template "role-header" (navigation "barber" "hairstyles" .)}}

<main class="wrap ui-page ui-confirmation">

    <h1>{{.Title}}</h1>

    <div class="panel ui-panel">

        <p>{{.Message}}</p>

        {{template "confirmation-actions" (confirmation .Action .CSRF "Yes, archive it" .Cancel "No, keep it")}}

    </div>

</main>

{{template "public-footer" .}}
</body>
</html>
