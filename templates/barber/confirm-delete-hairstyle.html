<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Barber Booking</title>
    <link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header class="topbar">
    <div class="wrap">
        <a class="brand" href="/barber/dashboard">Barber Booking</a>
        <nav class="nav" aria-label="Main">
            <a href="/barber/hairstyles">My hairstyles</a>
            <a href="/barber/bookings">Bookings</a>
            <a href="/barber/chats">Messages</a>
            <a href="/barber/profile">My profile</a>
        </nav>
    </div>
</header>

<main class="wrap">

    <h1>{{.Title}}</h1>

    <div class="panel">

        <p>{{.Message}}</p>

        <div class="actions">

            <!-- The delete itself is a POST carrying the session's CSRF
                 token, so it cannot be triggered by a link or an image
                 embedded on another site. -->
            <form class="inline" method="post" action="{{.Action}}">
                <input type="hidden" name="csrf_token" value="{{.CSRF}}">
                <button class="danger" type="submit">Yes, delete it</button>
            </form>

            <a class="button" href="{{.Cancel}}">No, keep it</a>

        </div>

    </div>

</main>

</body>
</html>
