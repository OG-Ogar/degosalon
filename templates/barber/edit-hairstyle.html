<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Hairstyle</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:40px;
}

form{
    max-width:700px;
}

label{
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:8px;
    margin-top:5px;
    margin-bottom:15px;
    box-sizing:border-box;
}

textarea{
    resize:vertical;
}

.checkbox{
    width:auto;
}

button{
    padding:10px 20px;
}

a{
    text-decoration:none;
}

</style>

</head>
<body>

<h1>Edit Hairstyle</h1>

<p>

<a href="/barber/dashboard">Dashboard</a>

|

<a href="/barber/hairstyles">My Hairstyles</a>

</p>

<hr>

<form action="/barber/hairstyles/{{.ID}}/update" method="POST">

<p>

<label for="name">Hairstyle Name</label>

<input
id="name"
type="text"
name="name"
value="{{.Name}}"
required>

</p>

<p>

<label for="category">Category</label>

<select id="category" name="category">

<option value="Fade" {{if eq .Category "Fade"}}selected{{end}}>Fade</option>
<option value="Braids" {{if eq .Category "Braids"}}selected{{end}}>Braids</option>
<option value="Dreadlocks" {{if eq .Category "Dreadlocks"}}selected{{end}}>Dreadlocks</option>
<option value="Kids" {{if eq .Category "Kids"}}selected{{end}}>Kids</option>
<option value="Women" {{if eq .Category "Women"}}selected{{end}}>Women</option>
<option value="Beard" {{if eq .Category "Beard"}}selected{{end}}>Beard</option>
<option value="Hair Coloring" {{if eq .Category "Hair Coloring"}}selected{{end}}>Hair Coloring</option>

</select>

</p>

<p>

<label for="description">Description</label>

<textarea
id="description"
name="description"
rows="5">{{.Description}}</textarea>

</p>

<p>

<label for="price">Price (₦)</label>

<input
id="price"
type="number"
name="price"
step="0.01"
min="0"
value="{{.Price}}"
required>

</p>

<p>

<label for="duration">Duration (Minutes)</label>

<input
id="duration"
type="number"
name="duration"
min="1"
value="{{.Duration}}"
required>

</p>

<p>

<label for="image">Image Path</label>

<input
id="image"
type="text"
name="image"
value="{{.Image}}">

</p>

<p>

<label>

<input
class="checkbox"
type="checkbox"
name="available"
{{if .IsAvailable}}checked{{end}}>

Available

</label>

</p>

<p>

<button type="submit">

Update Hairstyle

</button>

</p>

</form>

<hr>

<p>

<a href="/barber/hairstyles/{{.ID}}">

Cancel

</a>

</p>

</body>
</html>
