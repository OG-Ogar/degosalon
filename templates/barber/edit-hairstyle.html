<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Hairstyle</title>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 40px;
}

form {
    max-width: 700px;
}

label {
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    margin-bottom: 15px;
    box-sizing: border-box;
}

textarea {
    resize: vertical;
}

.checkbox {
    width: auto;
    margin: 0 5px 0 0;
}

button {
    padding: 10px 20px;
    cursor: pointer;
}

a {
    text-decoration: none;
}

.image-preview {
    margin-bottom: 15px;
}

.image-preview img {
    display: block;
    margin-top: 5px;
    border: 1px solid #ccc;
    padding: 4px;
    max-width: 250px;
}

</style>

</head>

<body>

<h1>Edit Hairstyle</h1>

<p>

<a href="/barber/dashboard">Dashboard</a>

|

<a href="/barber/hairstyles">My Hairstyles</a>

</p>

<hr>

<form
    action="/barber/hairstyles/{{.ID}}/update"
    method="POST">

    <p>

        <label for="name">
            Hairstyle Name
        </label>

        <input
            id="name"
            type="text"
            name="name"
            value="{{.Name}}"
            required>

    </p>

    <p>

        <label for="category">
            Category
        </label>

        <select
            id="category"
            name="category"
            required>

            <option
                value="Fade"
                {{if eq .Category "Fade"}}selected{{end}}>
                Fade
            </option>

            <option
                value="Braids"
                {{if eq .Category "Braids"}}selected{{end}}>
                Braids
            </option>

            <option
                value="Dreadlocks"
                {{if eq .Category "Dreadlocks"}}selected{{end}}>
                Dreadlocks
            </option>

            <option
                value="Kids"
                {{if eq .Category "Kids"}}selected{{end}}>
                Kids
            </option>

            <option
                value="Women"
                {{if eq .Category "Women"}}selected{{end}}>
                Women
            </option>

            <option
                value="Beard"
                {{if eq .Category "Beard"}}selected{{end}}>
                Beard
            </option>

            <option
                value="Hair Coloring"
                {{if eq .Category "Hair Coloring"}}selected{{end}}>
                Hair Coloring
            </option>

        </select>

    </p>

    <p>

        <label for="description">
            Description
        </label>

        <textarea
            id="description"
            name="description"
            rows="5"
            required>{{.Description}}</textarea>

    </p>

    <p>

        <label for="price">
            Price (₦)
        </label>

        <input
            id="price"
            type="number"
            name="price"
            step="0.01"
            min="0"
            value="{{.Price}}"
            required>

    </p>

    <p>

        <label for="duration">
            Duration (Minutes)
        </label>

        <input
            id="duration"
            type="number"
            name="duration"
            min="1"
            value="{{.Duration}}"
            required>

    </p>

    <p>

        <label for="image">
            Image Path
        </label>

        <input
            id="image"
            type="text"
            name="image"
            value="{{.Image}}"
            placeholder="/images/fade.jpg">

    </p>

    {{if .Image}}

    <div class="image-preview">

        <strong>Current Image:</strong>

        <img
            src="{{.Image}}"
            alt="{{.Name}}">

    </div>

    {{end}}

    <p>

        <label>

            <input
                class="checkbox"
                type="checkbox"
                name="available"
                value="on"
                {{if .IsAvailable}}checked{{end}}>

            Available

        </label>

    </p>

    <p>

        <button type="submit">
            Update Hairstyle
        </button>

    </p>

</form>

<hr>

<p>

<a href="/barber/hairstyles/{{.ID}}">
    Cancel
</a>

</p>

</body>
</html>
