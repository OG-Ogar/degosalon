<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Hairstyle</title>
</head>
<body>

<h1>Add New Hairstyle</h1>

<form action="/barber/hairstyles/new" method="POST">

    <p>
        <label>Hairstyle Name</label><br>
        <input
            type="text"
            name="name"
            placeholder="Skin Fade"
            required>
    </p>

    <p>
        <label>Category</label><br>

        <select name="category" required>

            <option value="">Select Category</option>

            <option value="Fade">Fade</option>

            <option value="Braids">Braids</option>

            <option value="Dreadlocks">Dreadlocks</option>

            <option value="Kids">Kids</option>

            <option value="Women">Women</option>

            <option value="Beard">Beard</option>

            <option value="Hair Coloring">Hair Coloring</option>

        </select>

    </p>

    <p>

        <label>Description</label><br>

        <textarea
            name="description"
            rows="5"
            cols="50"
            placeholder="Describe this hairstyle..."
            required></textarea>

    </p>

    <p>

        <label>Price (₦)</label><br>

        <input
            type="number"
            name="price"
            min="0"
            step="0.01"
            placeholder="2500"
            required>

    </p>

    <p>

        <label>Duration (Minutes)</label><br>

        <input
            type="number"
            name="duration"
            min="1"
            placeholder="30"
            required>

    </p>

    <p>

        <label>Image Path</label><br>

        <input
            type="text"
            name="image"
            placeholder="/images/fade.jpg">

    </p>

    <p>

        <button type="submit">

            Save Hairstyle

        </button>

    </p>

</form>

<hr>

<a href="/barber/dashboard">

    <button>

        Back to Dashboard

    </button>

</a>

</body>
</html>
