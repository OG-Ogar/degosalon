```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Hairstyle</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            margin:40px;
        }

        form{
            max-width:700px;
        }

        label{
            font-weight:bold;
        }

        input,
        select,
        textarea{
            width:100%;
            padding:8px;
            margin-top:5px;
            margin-bottom:15px;
            box-sizing:border-box;
        }

        textarea{
            resize:vertical;
        }

        button{
            padding:10px 20px;
            cursor:pointer;
        }

        a{
            text-decoration:none;
        }

    </style>

</head>
<body>

<h1>Add New Hairstyle</h1>

<p>

<a href="/barber/dashboard">

Dashboard

</a>

|

<a href="/barber/hairstyles">

Manage Hairstyles

</a>

</p>

<hr>

<form
    action="/barber/hairstyles/new"
    method="POST"
    enctype="multipart/form-data">

<p>

<label for="name">

Hairstyle Name

</label>

<input
    id="name"
    type="text"
    name="name"
    placeholder="Skin Fade"
    required>

</p>

<p>

<label for="category">

Category

</label>

<select
    id="category"
    name="category"
    required>

<option value="">Select Category</option>

<option value="Fade">Fade</option>

<option value="Braids">Braids</option>

<option value="Dreadlocks">Dreadlocks</option>

<option value="Kids">Kids</option>

<option value="Women">Women</option>

<option value="Beard">Beard</option>

<option value="Hair Coloring">Hair Coloring</option>

</select>

</p>

<p>

<label for="description">

Description

</label>

<textarea
    id="description"
    name="description"
    rows="5"
    placeholder="Describe this hairstyle..."
    required></textarea>

</p>

<p>

<label for="price">

Price (₦)

</label>

<input
    id="price"
    type="number"
    name="price"
    min="0"
    step="0.01"
    placeholder="2500"
    required>

</p>

<p>

<label for="duration">

Duration (Minutes)

</label>

<input
    id="duration"
    type="number"
    name="duration"
    min="1"
    placeholder="30"
    required>

</p>

<p>

<label for="image">

Hairstyle Image

</label>

<input
    id="image"
    type="file"
    name="image"
    accept="image/*">

</p>

<p>

<button type="submit">

Save Hairstyle

</button>

</p>

</form>

<hr>

<p>

<a href="/barber/dashboard">

← Back to Dashboard

</a>

</p>

</body>
</html>
```
