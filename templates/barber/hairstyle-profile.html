<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hairstyle Details</title>
</head>
<body>

<h1>{{.Name}}</h1>

<p><strong>Category:</strong> {{.Category}}</p>

<p><strong>Description:</strong> {{.Description}}</p>

<p><strong>Price:</strong> ₦{{printf "%.2f" .Price}}</p>

<p><strong>Duration:</strong> {{.DurationMinutes}} minutes</p>

<p><strong>Image:</strong> {{.Image}}</p>

<p>
<strong>Status:</strong>

{{if .IsAvailable}}

Available

{{else}}

Unavailable

{{end}}

</p>

<hr>

<p>

<a href="/barber/hairstyles/{{.ID}}/edit">

<button>Edit</button>

</a>

<a href="/barber/hairstyles/{{.ID}}/delete">

<button>Delete</button>

</a>

<a href="/barber/hairstyles">

<button>Back</button>

</a>

</p>

</body>
</html>
