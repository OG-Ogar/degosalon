<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barber Login</title>
</head>
<body>

<h1>Barber Login</h1>

<p>
    Login to your barber account.
</p>

<hr>

<form method="POST" action="/barber/login">

    <p>
        <label for="email">
            Email
        </label>

        <br>

        <input
            type="email"
            id="email"
            name="email"
            required>
    </p>

    <p>
        <label for="password">
            Password
        </label>

        <br>

        <input
            type="password"
            id="password"
            name="password"
            required>
    </p>

    <p>
        <button type="submit">
            Login
        </button>
    </p>

</form>

<hr>

<p>
    Don't have a barber account?
</p>

<p>
    <a href="/barber/register">
        Create New Account
    </a>
</p>

<p>
    <a href="/">
        ← Back Home
    </a>
</p>

</body>
</html>
