<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Barber Registration - De Go Salon</title>

<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/login.css">

<script src="/static/app.js" defer></script>


</head>

<body class="auth-page barber-auth modern-role-page">

<main class="auth-layout">


<section class="auth-card">

    <div class="auth-brand">
        <a href="/">De Go Salon</a>
    </div>

    <div class="auth-header">
        <h1>Create an Account</h1>
        <p>Create your barber account to get started.</p>
    </div>

    {{if .Error}}
        <p class="auth-message auth-error" role="alert">
            {{.Error}}
        </p>
    {{end}}

    <form class="auth-form"
          method="post"
          action="/barber/register"
          enctype="multipart/form-data">

        <div class="auth-field">

            <label for="fullname">
                Full Name
            </label>

            <input
                id="fullname"
                type="text"
                name="fullname" maxlength="120"
                value="{{index .Values "fullname"}}"
                autocomplete="name"
                placeholder="Enter your full name"
                required
            >

        </div>

        <div class="auth-field">

            <label for="phone">
                Phone
            </label>

            <input
                id="phone"
                type="tel"
                name="phone" maxlength="32"
                value="{{index .Values "phone"}}"
                autocomplete="tel"
                placeholder="Enter your phone number"
                required
            >

        </div>

        <div class="auth-field">

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                name="email" maxlength="254"
                value="{{index .Values "email"}}"
                autocomplete="email"
                placeholder="Enter your email"
                required
            >

        </div>

        <div class="auth-field">

            <label for="shopname">
                Shop Name
            </label>

            <input
                id="shopname"
                type="text"
                name="shopname" maxlength="160"
                value="{{index .Values "shopname"}}"
                placeholder="Enter your shop name"
                required
            >

        </div>

        <div class="auth-field">

            <label for="shopaddress">
                Shop Address
            </label>

            <input
                id="shopaddress"
                type="text"
                name="shopaddress" maxlength="300"
                value="{{index .Values "shopaddress"}}"
                placeholder="Enter your shop address"
                required
            >

        </div>

        <div class="auth-field">
            <label for="state">State</label>
            {{template "geography-state" (index .Values "state")}}
        </div>

        <div class="auth-field">
            <label for="local_area">Local government area / area council</label>
            {{template "geography-profile-area" .Values}}
        </div>

        <div class="auth-field">

            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                name="password"
                autocomplete="new-password"
                placeholder="Enter your password"
                required
            >

        </div>

        <div class="auth-field">

            <label for="confirm_password">
                Confirm Password
            </label>

            <input
                id="confirm_password"
                type="password"
                name="confirm_password"
                autocomplete="new-password"
                placeholder="Confirm your password"
                required
            >

        </div>

        <div class="auth-field">

            <label for="personal_image">
                Profile Photo
            </label>

            <input
                class="professional-file-input"
                id="personal_image"
                type="file"
                name="personal_image"
                accept="image/*"
                required
            >

        </div>

        <button class="auth-submit" type="submit">
            Create Account
        </button>

    </form>

    <div class="auth-register">

        <span>Already have an account?</span>

        <a href="/barber/login">
            Sign In
        </a>

    </div>

    <div class="auth-footer">

        <a href="/">
            ← Back to De Go Salon
        </a>

    </div>

</section>


</main>

</body>
</html>
