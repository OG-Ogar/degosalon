<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Barber Account</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        form {
            max-width: 500px;
        }

        p {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
        }

        a {
            text-decoration: none;
        }

    </style>

</head>
<body>

<h1>Create Barber Account</h1>

<p>

Already have an account?

<a href="/barber/login">

Login here

</a>

</p>

<hr>

<form method="POST" action="/barber/register">

<p>

<label>Full Name</label><br>

<input
type="text"
name="fullname"
required>

</p>

<p>

<label>Phone Number</label><br>

<input
type="text"
name="phone"
required>

</p>

<p>

<label>Email</label><br>

<input
type="email"
name="email"
required>

</p>

<p>

<label>Shop Name</label><br>

<input
type="text"
name="shopname"
required>

</p>

<p>

<label>Shop Address</label><br>

<input
type="text"
name="shopaddress"
required>

</p>

<p>

<label>Password</label><br>

<input
type="password"
name="password"
required>

</p>

<p>

<label>Confirm Password</label><br>

<input
type="password"
name="confirm_password"
required>

</p>

<p>

<button type="submit">

Create Account

</button>

</p>

</form>

<hr>

<p>

<a href="/">

← Back Home

</a>

</p>

</body>
</html>
