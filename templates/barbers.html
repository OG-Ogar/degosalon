<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Barbers</title>
</head>
<body>
    <h1>All Barbers</h1>

    {{range .}}
    <h2>{{.FullName}}</h2>

    <p>Phone: {{.PhoneNumber}}</p>

    <p>Email: {{.Email}}</p>

    <p>Shop: {{.ShopName}}</p>

    <p>Address: {{.ShopAddress}}</p>

    <p>Status: {{.Status}}</p>
    
    {{end}}
</body>
</html>
