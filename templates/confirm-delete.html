<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Barber</title>
</head>
<body>
    <h1>Delete Barber</h1>

    <p>Are you sure you want to delete <strong>{{.FullName}}</strong>?</p>
    <form method="POST" action="/admin/barbers/{{.ID}}/delete">
        <button type="submit">Yes, Delete</button>
    </form>
    <p>
        <a href="/admin/barbers/{{.ID}}">
            Cancel
        </a>
    </p>
    
</body>
</html>
