<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - OG's Salon</title>
    <script src="/static/theme-switch.js"></script>
    <link rel="stylesheet" href="/static/app.css">
    <link rel="stylesheet" href="/static/customer-dashboard.css">
    <link rel="stylesheet" href="/static/social-feed.css?v=7">
    <link rel="stylesheet" href="/static/ui.css">
    <link rel="stylesheet" href="/static/theme.css">
    <script src="/static/app.js" defer></script>
    <script src="/static/social-feed.js" defer></script>
</head>
<body class="modern-customer-page">
<div class="customer-dashboard">
    {{if .BackgroundImage}}
        <img class="dashboard-background" src="{{.BackgroundImage}}" srcset="{{imageSrcset .BackgroundImage}}" sizes="100vw" width="1600" height="1200" alt="" loading="eager" fetchpriority="high" decoding="async">
    {{else}}
        <div class="dashboard-background dashboard-no-image"></div>
    {{end}}

    <div class="dashboard-overlay"></div>

    {{template "role-header" (navigation "customer" "dashboard" .)}}

    {{template "social-feed" .Feed}}
</div>

{{template "public-footer" .}}
</body>
</html>
