<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Customer Login - Barbermultiverse</title>

<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/login.css">

<script src="/static/app.js" defer></script>
```

</head>

<body class="auth-page customer-auth">

<main class="auth-layout">

```
<section class="auth-card">

    <div class="auth-brand">
        <a href="/">Barbermultiverse</a>
    </div>

    <div class="auth-header">
        <h1>Customer Login</h1>
        <p>Welcome back. Sign in to continue.</p>
    </div>

    {{if .Notice}}
        <p class="auth-message auth-notice" role="status">
            {{.Notice}}
        </p>
    {{end}}

    {{if .Error}}
        <p class="auth-message auth-error" role="alert">
            {{.Error}}
        </p>
    {{end}}

    <form class="auth-form"
          method="post"
          action="/customer/login">

        <div class="auth-field">
            <label for="email">Email</label>

            <input
                id="email"
                type="email"
                name="email"
                value="{{index .Values "email"}}"
                autocomplete="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <div class="auth-field">
            <label for="password">Password</label>

            <input
                id="password"
                type="password"
                name="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                required
            >
        </div>

        <div class="auth-options">
            <a href="/customer/forgot-password">
                Forgot your password?
            </a>
        </div>

        <button class="auth-submit" type="submit">
            Sign In
        </button>

    </form>

    <div class="auth-register">
        <span>Don't have an account?</span>

        <a href="/customer/register">
            Create an account
        </a>
    </div>

    <div class="auth-footer">
        <a href="/">
            ← Back to Barbermultiverse
        </a>
    </div>

</section>
```

</main>

</body>
</html>
