<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - Barber Booking</title>

    <link rel="stylesheet" href="/static/app.css">
    <link rel="stylesheet" href="/static/customer-profile.css">
    <link rel="stylesheet" href="/static/image-viewer.css">

    <script src="/static/app.js" defer></script>
    <script src="/static/image-viewer.js" defer></script>
</head>

<body class="customer-page">

<header class="customer-simple-header">

    <a class="customer-brand" href="/customer/dashboard">
        Barber Booking
    </a>

    <div class="customer-header-actions">

        <a href="/customer/dashboard">
            Dashboard
        </a>

        <form method="post" action="/customer/logout">
            <input
                type="hidden"
                name="csrf_token"
                value="{{.CSRF}}"
            >

            <button type="submit">
                Log out
            </button>
        </form>

    </div>

</header>

<main class="customer-profile-page">

    <div class="customer-profile-card">

        <div class="customer-profile-photo">

            {{if .Customer.ProfileImage}}
               <img
            class="fullscreen-image"
            src="{{.Customer.ProfileImage}}"
            alt="{{.Customer.FullName}}"
            data-fullscreen-image
        >
            {{else}}
                <div class="customer-profile-placeholder">
                    {{printf "%.1s" .Customer.FullName}}
                </div>
            {{end}}

        </div>

        <div class="customer-profile-info">

            <p class="customer-profile-label">
                Customer Profile
            </p>

            <h1>{{.Customer.FullName}}</h1>

            <div class="customer-details">

                <div>
                    <span>Phone</span>
                    <strong>{{.Customer.PhoneNumber}}</strong>
                </div>

                <div>
                    <span>Email</span>
                    <strong>{{.Customer.Email}}</strong>
                </div>

            </div>

            <div class="customer-profile-actions">

                <a
                    class="customer-primary-button"
                    href="/customer/profile/edit"
                >
                    Edit Profile
                </a>

                <a
                    class="customer-secondary-button"
                    href="/customer/dashboard"
                >
                    Back to Dashboard
                </a>

            </div>

        </div>

    </div>

</main>

</body>
</html>
