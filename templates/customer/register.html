<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create a Customer Account - De Go Salon</title>

    <link rel="stylesheet" href="/static/app.css">
    <link rel="stylesheet" href="/static/login.css">

    <script src="/static/app.js" defer></script>
</head>

<body class="auth-page customer-auth modern-customer-page">

<main class="auth-layout">

    <section class="auth-card">

        <div class="auth-brand">
            <a href="/">De Go Salon</a>
        </div>

        <div class="auth-header">
            <h1>Create an Account</h1>
            <p>Create your customer account to get started.</p>
        </div>

        {{if .Error}}
            <p class="auth-message auth-error" role="alert">
                {{.Error}}
            </p>
        {{end}}

        <form class="auth-form"
              method="post"
              action="/customer/register"
              enctype="multipart/form-data">
 <input type="hidden" name="next" value="{{index .Values "next"}}">

            <div class="auth-field">

                <label for="profile_image">
                    Profile Photo
                </label>

                <input
                    id="profile_image"
                    type="file"
                    name="profile_image"
                    accept="image/jpeg,image/png,image/gif,image/webp"
                >

                <p class="hint">
                    Optional. JPG, PNG, GIF or WebP, up to 5 MB.
                </p>

            </div>

            <div class="auth-field">

                <label for="fullname">
                    Full Name
                </label>

                <input
                    id="fullname"
                    type="text"
                    name="fullname" maxlength="120"
                    value="{{index .Values "fullname"}}"
                    autocomplete="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>

            <div class="auth-field">

                <label for="phone">
                    Phone
                </label>

                <input
                    id="phone"
                    type="tel"
                    name="phone" maxlength="32"
                    value="{{index .Values "phone"}}"
                    autocomplete="tel"
                    placeholder="Enter your phone number"
                    required
                >

            </div>

            <div class="auth-field">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    name="email" maxlength="254"
                    value="{{index .Values "email"}}"
                    autocomplete="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="auth-field">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    name="password"
                    autocomplete="new-password"
                    minlength="8"
                    placeholder="Enter your password"
                    required
                    aria-describedby="password-hint"
                >

                <p class="hint" id="password-hint">
                    At least 8 characters.
                </p>

            </div>

            <div class="auth-field">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    id="confirm_password"
                    type="password"
                    name="confirm_password"
                    autocomplete="new-password"
                    minlength="8"
                    placeholder="Confirm your password"
                    required
                >

            </div>

            <button class="auth-submit" type="submit">
                Create Account
            </button>

        </form>

        <div class="auth-register">

            <span>Already have an account?</span>

            <a href="/customer/login?next={{urlquery (index .Values "next")}}">
                Sign In
            </a>

        </div>

        <div class="auth-footer">

            <a href="/">
                ← Back to De Go Salon
            </a>

        </div>

    </section>

</main>

</body>
</html>
