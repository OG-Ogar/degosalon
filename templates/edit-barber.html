<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Barber</title>
</head>
<body>
    <h1>Edit Barber</h1>

    <form method="POST" action="/admin/barbers/{{.ID}}/update">
        <label>Full Name</label><br>
        <input type="text" name="fullname" value="{{.FullName}}"><br><br>

        <label>Email</label><br>
        <input type="email" name="email" value="{{.Email}}"><br><br>

        <label>Phone</label><br>
        <input type="text" name="phone" value="{{.PhoneNumber}}"><br><br>

        <label>Shop</label><br>
        <input type="text" name="shopname" value="{{.ShopName}}"><br><br>

        <label>Address</label><br>
        <input type="text" name="shopaddress" value="{{.ShopAddress}}"><br><br>

        <button type="submit">Save Changes</button>
    </form>
</body>
</html>
