<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barber Booking</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/app.js" defer></script>
</head>

<body class="landing-page">

<main class="landing"
      {{if .LandingImage}}
      style="background-image: url('{{.LandingImage}}');"
      {{end}}>

    <div class="landing-overlay">

        <header class="landing-header">

            <a class="landing-login landing-login-barber"
               href="/barber/login">
                Barber Login
            </a>

            <a class="landing-brand" href="/">
                Barber Booking
            </a>

            <a class="landing-login landing-login-admin"
               href="/admin/login">
                Admin Login
            </a>

        </header>

        <section class="landing-content">

            <div class="landing-main-content">

                <h1>
                    Find your barber.
                </h1>

                <p>
                    Choose a barber, explore hairstyles and prices,
                    then book your appointment.
                </p>

                <a class="landing-button"
                   href="/customer/barbers">
                    Find a Barber
                </a>

            </div>

        </section>

    </div>

</main>

</body>
</html>
