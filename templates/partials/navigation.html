{{define "role-header"}}
<header class="site-header">
<div class="site-header-inner">
<a class="site-brand" href="/{{.Role}}/dashboard" aria-label="De Go Salon {{.Role}} workspace"><span class="site-brand-mark" aria-hidden="true">DG</span><span class="site-brand-copy"><span class="site-brand-name">De Go Salon</span><span class="site-brand-role">{{.Role}}</span></span></a>
<nav class="site-navigation" aria-label="{{.Role}} navigation">
{{range .Links}}<a class="site-nav-link{{if .Active}} active{{end}}" href="{{.Path}}"{{if .Active}} aria-current="page"{{end}}><span class="site-nav-label">{{.Label}}</span></a>{{end}}
</nav>
<div class="site-header-actions">
{{if eq .Role "customer"}}<a class="cart-pill-link" href="/customer/cart" aria-label="Shopping cart"><span class="cart-pill-icon" aria-hidden="true">🛒</span><span class="cart-pill-label">Cart</span></a>{{end}}
{{if .CSRF}}<form class="site-logout" method="post" action="/{{.Role}}/logout"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><button type="submit" class="site-logout-btn">Log out</button></form>{{end}}
</div>
</div>
</header>
{{end}}
