<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Name}} - OG's Salon</title>
<script src="/static/theme-switch.js"></script>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/ui.css">
<link rel="stylesheet" href="/static/theme.css">
<script src="/static/app.js" defer></script>
</head>
<body class="modern-customer-page">
<main class="ui-page" style="width:min(100% - 32px,560px);margin:4rem auto;">
  <section class="ui-panel" style="padding:clamp(1.5rem,5vw,2.5rem);text-align:center;border-radius:18px;">
    <div style="display:grid;place-items:center;width:120px;height:120px;margin:0 auto 1.25rem;overflow:hidden;border:3px solid var(--signal,#f4cb78);border-radius:50%;background:var(--surface-hi,#254137);color:var(--signal,#f4cb78);font-size:2.5rem;font-weight:850;">
      {{if .Image}}<img src="{{.Image}}" alt="Profile photo of {{.Name}}" srcset="{{imageSrcset .Image}}" sizes="120px" width="120" height="120" style="width:100%;height:100%;object-fit:cover;">{{else}}{{printf "%.1s" .Name}}{{end}}
    </div>

    <p class="eyebrow" style="margin:0 0 .4rem;">OG's Salon community</p>
    <h1 style="margin:0 0 1rem;">{{.Name}}</h1>
    <p style="margin:0 auto 1.5rem;max-width:36ch;color:var(--ink-muted,#c2d4c7);line-height:1.6;">
      This is a customer profile from the OG's Salon community feed. Contact details stay private.
    </p>

    <div class="ui-actions" style="display:flex;justify-content:center;flex-wrap:wrap;gap:.75rem;">
      <a class="ui-control" href="/">OG's Salon home</a>
      <a class="ui-control" href="/explore">Explore barbers</a>
    </div>
  </section>
</main>

{{template "public-footer" .}}
</body>
</html>
